<style>

.btn.g2{background:var(--sf);color:var(--tx);border:1px solid var(--bd)}.btn.r{background:#dc2626}.btn.gr{background:#059669}
.tb{background:var(--sf);border:1px solid var(--bd);border-radius:10px;overflow:hidden}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;min-width:760px}
th,td{text-align:left;padding:12px 16px;border-bottom:1px solid var(--bd);vertical-align:middle}

tbody tr{cursor:pointer}tbody tr:hover{background:var(--hv)}tr:last-child td{border:0}
.id{font-weight:700;color:#2563eb}.sm{color:var(--mu);font-size:12px}
.pill{display:inline-block;padding:2px 10px;border-radius:99px;font-size:12px;font-weight:600}
.pill.dilaporkan{background:#dbeafe;color:#1d4ed8}.pill.ditugaskan{background:#ede9fe;color:#6d28d9}.pill.perbaikan{background:#fef3c7;color:#b45309}.pill.verifikasi{background:#fee2e2;color:#b91c1c}.pill.siap{background:#ccfbf1;color:#0f766e}.pill.closed{background:#d1fae5;color:#047857}
.act{display:inline-block;margin-left:6px;font-size:11px;font-weight:700;color:var(--or)}
.pr-Tinggi{color:#dc2626;font-weight:600}.pr-Sedang{color:#d97706;font-weight:600}.pr-Rendah{color:#059669;font-weight:600}
.em{padding:36px;text-align:center;color:var(--mu)}
.ov{position:fixed;inset:0;background:rgba(10,18,36,.55);display:none;justify-content:flex-end;z-index:20}.ov.on{display:flex}
.pn{background:var(--sf);width:min(500px,100%);height:100%;overflow-y:auto;padding:22px;padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(22px + env(safe-area-inset-bottom,0px))}

.mt{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}

.ac{background:var(--bn);border-radius:10px;padding:14px;margin-top:10px}.ac h4{margin:0 0 8px}
.row{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap}
.f label{display:block;margin:12px 0 4px;font-size:12px;color:var(--mu);font-weight:600}
.ph2{display:flex;gap:8px;flex-wrap:wrap}
.th{position:relative;width:84px;height:84px;border-radius:8px;overflow:hidden;border:1px solid var(--bd);cursor:pointer}
.th img{width:100%;height:100%;object-fit:cover;display:block}
.th u{position:absolute;top:2px;right:2px;width:20px;height:20px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;text-decoration:none;display:grid;place-items:center;font-size:13px}
.lgx{border-left:2px solid var(--bd);margin:12px 0 0 6px;padding-left:16px}
.lgx div{position:relative;margin-bottom:14px}.lgx div:before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:#2563eb}
.lb{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;place-items:center;z-index:40}.lb.on{display:grid}.lb img{max-width:92%;max-height:90%;border-radius:8px}
.toast{position:fixed;bottom:calc(20px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:8px;z-index:50;display:none}
@media(max-width:760px){main{padding:14px}.ph{padding:14px}.ph h1{font-size:20px}.top .sb{width:55%}}

.gate{position:fixed;inset:0;background:var(--bg);display:none;place-items:center;z-index:60;padding:20px}.gate.on{display:grid}
.gc{background:var(--sf);border:1px solid var(--bd);border-radius:14px;padding:28px;width:min(440px,100%)}.gc h2{margin:0 0 6px}.gc p{color:var(--mu)}
.mebtn{background:none;border:1px solid #4a5d86;border-radius:99px;color:#fff;padding:6px 14px;cursor:pointer;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.mebtn small{color:#9fb0cf;font-weight:400;margin-left:6px}
.ro{background:#fef3c7;color:#92400e;border-radius:8px;padding:10px 14px;margin-bottom:14px}
.hdr{display:flex;gap:8px;align-items:center}
.ib.tx{width:auto;padding:0 14px;gap:8px;display:inline-flex;font-weight:600}
</style>
</head>
<body>
<div id="app">
<aside id="sb"></aside>
<div class="mn">
  <div class="top"><div class="sb"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg><input id="q" placeholder="Cari ID, mesin, masalah"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="config.js"></script>
<script>
const ST={dilaporkan:"Dilaporkan",ditugaskan:"Ditugaskan",perbaikan:"Dalam Perbaikan",verifikasi:"Menunggu Verifikasi",siap:"Siap Di-close",closed:"Closed"};
const SC={dilaporkan:"#3b82f6",ditugaskan:"#8b5cf6",perbaikan:"#f59e0b",verifikasi:"#ef4444",siap:"#14b8a6",closed:"#10b981"};
const RL={produksi:"SPV/Karu/Leader Produksi",manager:"Manager/SPV ME",staff:"Staff ME",editor:"Editor"};
const PAGES={produksi:["tix"],manager:["dash","tix"],staff:["tix"],editor:["dash","tix","usr"]};const pagesFor=r=>PAGES[r].filter(x=>x!=="usr"||canMgr);
const PN={dash:["Dashboard","Ringkasan real-time tiket perbaikan mesin"],tix:["Daftar Tiket","Laporan kerusakan dan status perbaikan mesin"],usr:["Pengguna","Kelola nama dan peran anggota tim"]};
const IC={dash:'<rect x="3" y="3" width="7" height="9" rx="1"/><rect x="14" y="3" width="7" height="5" rx="1"/><rect x="14" y="12" width="7" height="9" rx="1"/><rect x="3" y="16" width="7" height="5" rx="1"/>',
tix:'<rect x="8" y="2" width="8" height="4" rx="1"/><path d="M16 4h2a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h2"/><path d="M9 12h6M9 16h6"/>',
cam:'<path d="M14.5 4h-5L7 7H4a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V9a2 2 0 0 0-2-2h-3z"/><circle cx="12" cy="13" r="3"/>',
dl:'<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><path d="m7 10 5 5 5-5"/><path d="M12 15V3"/>',
usr:'<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',ch:'<path d="m15 18-6-6 6-6"/>',clock:'<circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/>',pulse:'<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>',ok:'<circle cx="12" cy="12" r="10"/><path d="m9 12 2 2 4-4"/>',
wr:'<path d="M14.7 6.3a4 4 0 0 0 5 5L21 17l-4 4-5.7-1.3a4 4 0 0 0-5-5L3 7l4-4z"/>'};
const ic=(n,s=20)=>`<svg width="${s}" height="${s}" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${IC[n]}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt=d=>new Date(d).toLocaleString("id-ID",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
const full=d=>new Date(d).toLocaleString("id-ID",{dateStyle:"short",timeStyle:"short"});
let sb,dl=true,uid,canW=true,canMgr=false,nm0="",prof=null,U=[],T=[],okU=false,okT=false,tab="tix",q="",fs="",col=innerWidth<760,fp=[],cur=null,mode=null,P=[],unP=null,busy=false,rev="",editing=false;
function toast(m){const t=$("#toast");t.textContent=m;t.style.display="block";clearTimeout(toast.h);toast.h=setTimeout(()=>t.style.display="none",2600)}
function gate(h){$("#gate").innerHTML=`<div class="gc">${h}</div>`;$("#gate").classList.add("on")}
const hideGate=()=>$("#gate").classList.remove("on");
const em=e=>e&&(e.message||e.code)||"";
const er=e=>gate(`<h2>Gagal memuat data</h2><p>${esc(em(e))}</p><div class="row"><button class="btn" onclick="location.reload()">Muat ulang</button></div>`);
const K={staffId:"staff_id",staffNama:"staff_nama",nFoto:"n_foto",pelaporId:"pelapor_id"};
const rowOf=p=>Object.fromEntries(Object.entries(p).map(([k,v])=>[K[k]||k,k==="staffId"&&v===""?null:v]));
const tk=r=>({id:r.id,mesin:r.mesin,lokasi:r.lokasi,masalah:r.masalah,prioritas:r.prioritas,pelapor:r.pelapor,pelaporId:r.pelapor_id,staffId:r.staff_id||"",staffNama:r.staff_nama||"",status:r.status,tgl:r.tgl,upd:r.upd,nFoto:r.n_foto,log:r.log||[]});
async function loadU(){const{data,error}=await sb.from("profiles").select("*");if(error){er(error);return}U=data.map(u=>({id:u.id,nama:u.nama,role:u.role,at:u.created_at}));prof=U.find(u=>u.id===uid)||null;okU=true}
async function loadT(){const{data,error}=await sb.from("tickets").select("*").order("tgl",{ascending:false});if(error){er(error);return}T=data.map(tk);okT=true}
async function loadP(id){const{data,error}=await sb.from("photos").select("*").eq("ticket_id",id).order("at");if(error||cur!==id)return;
 const urls={};if(data.length){const r=await sb.storage.from("foto").createSignedUrls(data.map(p=>p.path),3600);(r.data||[]).forEach(x=>urls[x.path]=x.signedUrl)}
 P=data.map(p=>({id:p.id,path:p.path,by:p.oleh,at:p.at,d:urls[p.path]||""}));const g=$("#gal");if(g)g.innerHTML=galHTML()}
async function addPhotos(tid,list){for(const f of list){const b=await(await fetch(f)).blob(),path=tid+"/"+(crypto.randomUUID?crypto.randomUUID():Date.now()+Math.random().toString(36).slice(2))+".jpg";
 const u=await sb.storage.from("foto").upload(path,b,{contentType:"image/jpeg"});if(u.error)throw u.error;
 const i=await sb.from("photos").insert({ticket_id:tid,path,oleh:prof.nama});if(i.error)throw i.error}}
async function delPhoto(p,tid){if(busy)return;busy=true;try{await sb.storage.from("foto").remove([p.path]);const{error}=await sb.from("photos").delete().eq("id",p.id);if(error)throw error;await loadT();await loadP(tid);toast("Foto dihapus")}catch(e){toast("Gagal: "+em(e))}busy=false}
async function delTicket(id){const{data}=await sb.from("photos").select("path").eq("ticket_id",id);if(data&&data.length)await sb.storage.from("foto").remove(data.map(p=>p.path));const r=await sb.from("tickets").delete().eq("id",id).select("id");if(r.error||!r.data.length)throw r.error||{message:"Tidak diizinkan"};await loadT();render()}
function saveFile(name,blob){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000)}
let started=false;
async function start(u){if(started)return;started=true;uid=u.id;gate("<p>Memuat data…</p>");
 await Promise.all([loadU(),loadT()]);if(!okU||!okT)return;
 sb.channel("rt").on("postgres_changes",{event:"*",schema:"public",table:"tickets"},async()=>{await loadT();render()}).on("postgres_changes",{event:"*",schema:"public",table:"profiles"},async()=>{await loadU();render()}).on("postgres_changes",{event:"*",schema:"public",table:"photos"},()=>{if(mode==="detail"&&cur)loadP(cur)}).subscribe();
 render()}
async function init(){
 const c=window.APP_CONFIG||{};
 if(!window.supabase||!c.SUPABASE_URL||!c.SUPABASE_ANON_KEY||/ISI_|XXXX/.test(c.SUPABASE_URL+c.SUPABASE_ANON_KEY)){gate("<h2>Konfigurasi belum diisi</h2><p>Isi file <b>config.js</b> dengan Project URL dan anon key dari Supabase. Lihat PANDUAN-SETUP.md.</p>");return}
 sb=supabase.createClient(c.SUPABASE_URL,c.SUPABASE_ANON_KEY);
 const{data}=await sb.auth.getSession();
 if(data.session)await start(data.session.user);else authScreen(false);
 sb.auth.onAuthStateChange(ev=>{if(ev==="SIGNED_OUT")location.reload()});
}
function authScreen(reg){
 gate(`<h2>${reg?"Daftar akun":"Masuk"}</h2><p>Sistem Tracking Perbaikan Mesin</p><div class="f">${reg?'<label>Nama lengkap</label><input class="fi" id="an" autocomplete="name">':""}<label>Email</label><input class="fi" id="ae" type="email" autocomplete="email"><label>Password${reg?" (min. 6 karakter)":""}</label><input class="fi" id="ap" type="password" autocomplete="${reg?"new-password":"current-password"}">${reg?`<label>Peran</label><select class="fi" id="ar" style="width:100%"><option value="produksi">${RL.produksi}</option><option value="staff">${RL.staff}</option></select><div class="sm" style="margin-top:6px">Peran Manager dan Editor diberikan oleh Editor. Pengguna pertama otomatis menjadi Editor.</div>`:""}</div><div class="row" style="margin-top:18px"><button class="btn" id="ago">${reg?"Daftar":"Masuk"}</button><button class="btn g2" id="asw">${reg?"Sudah punya akun":"Buat akun baru"}</button></div>`);
 $("#asw").onclick=()=>authScreen(!reg);
 const go=async()=>{const e=$("#ae").value.trim(),p=$("#ap").value;if(!e||!p){toast("Email dan password wajib diisi");return}
  const n=reg?$("#an").value.trim():"";if(reg&&!n){toast("Nama wajib diisi");return}
  $("#ago").disabled=true;
  try{if(reg){const{data,error}=await sb.auth.signUp({email:e,password:p,options:{data:{nama:n,role:$("#ar").value}}});if(error)throw error;

  const sid=$("#es").value,su=staff.find(u=>u.id===sid),p={mesin:m,lokasi:$("#el").value.trim()||"-",masalah:d,prioritas:$("#ep").value,staffId:sid,staffNama:su?su.nama:"",status:$("#et").value};
  const L={mesin:"mesin",lokasi:"lokasi",masalah:"deskripsi",prioritas:"prioritas",staffNama:"staff",status:"status"},ch=Object.keys(L).filter(k=>p[k]!==t[k]||(k==="staffNama"&&(p.staffId!==(t.staffId||""))));
  if(!ch.length){back();return}
  await act(t,p,"Data diedit","Diedit oleh Editor: "+ch.map(k=>L[k]).join(", "),"Perubahan disimpan");back()};
}
function close(){$("#ov").classList.remove("on");mode=null;cur=null;}
$("#ov").onclick=e=>{if(e.target.id==="ov")close()};
$("#lb").onclick=()=>$("#lb").classList.remove("on");
$("#main").onclick=async e=>{const d=e.target.closest("[data-d]");
 if(d){if(!d.dataset.c){d.dataset.c=1;d.textContent="Yakin hapus?";setTimeout(()=>{if(d.isConnected){delete d.dataset.c;d.textContent="Hapus"}},4000);return}
  try{const{error}=await sb.rpc("hapus_pengguna",{target:d.dataset.d});if(error)throw error;await loadU();render();toast("Pengguna dihapus")}catch(z){toast("Gagal: "+em(z))}return}
 const r=e.target.closest("tr[data-id]");if(r)openDetail(r.dataset.id)};
$("#main").onchange=async e=>{const s=e.target.closest("[data-r]");if(s){try{const{data,error}=await sb.from("profiles").update({role:s.value}).eq("id",s.dataset.r).select("id");if(error||!data.length)throw error||{message:"Tidak diizinkan"};await loadU();render();toast("Peran diperbarui")}catch(z){toast("Gagal: "+em(z));render()}}};
$("#sb").onclick=e=>{if(e.target.closest("#cl")){col=!col;side();return}const b=e.target.closest("[data-t]");if(b){tab=b.dataset.t;render()}};
$("#q").oninput=e=>{q=e.target.value;if(prof&&tab!=="tix"&&pagesFor(prof.role).includes("tix"))tab="tix";if(okU&&okT&&prof)render()};
$("#me").onclick=()=>{if(prof){editing=true;profForm()}};
init();
</script>
